[package]
name = "kutsu"
version = "0.1.0"
edition = "2024"
description = "Outbound SIP calling MCP server, bridging real phone calls to Gemini Live"
license = "MIT"

[lib]
name = "kutsu"
path = "src/lib.rs"

[[bin]]
name = "kutsu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
async-http-proxy = { version = "1.2", features = ["runtime-tokio", "basic-auth"] }
# rustls 0.23 requires the app to select a crypto provider; we install `ring`
# once before any TLS handshake (see proxy::connect_ws).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ezk-sip-ua = "0.9"
# SRTP (media encryption) needs OpenSSL's libcrypto: ezk-rtc -> ezk-srtp ->
# openssl-sys. By default the build links a *system* OpenSSL. For portable,
# self-contained builds across systems that lack one, enable `vendor-openssl`
# (below), which compiles OpenSSL from source and links it statically. See README.
ezk-rtc = "0.0.1"
hound = "3"
bytes = "1"
bytesstr = "1"
ezk-sip-core = "0.9"
ezk-sip-auth = "0.5"
ezk-sip-types = "0.6"

[features]
# Build OpenSSL from source and link it statically instead of relying on a
# system OpenSSL. Forwarded to ezk-rtc's vendored toggle; Cargo feature
# unification makes the transitive openssl-sys (ezk-srtp) vendored too, so the
# whole tree uses the source build. Requires perl + a C compiler on the build
# host (+ nasm on Windows for asm-optimized OpenSSL). Use for release binaries
# targeting multiple systems: one `cargo build --features vendor-openssl`
# recipe yields a self-contained binary needing no OpenSSL on the deploy host.
vendor-openssl = ["ezk-rtc/vendor-openssl"]
live-tests = []

[dev-dependencies]
tempfile = "3"
# test-util adds start_paused/time::advance for the bridge's deterministic
# pacer tests; only active in dev/test builds, not a new dependency.
tokio = { version = "1", features = ["test-util"] }
