name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build deps
        run: |
          sudo apt-get update
          # System OpenSSL keeps CI fast (release builds vendor it instead);
          # cmake -> libsrtp2, clang/libclang -> bindgen, libdbus-1-dev -> the
          # rtkit path of audio_thread_priority.
          sudo apt-get install -y cmake clang libclang-dev libssl-dev pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
