;=====================================================================
; Dialplan for the kutsu local SIP test.
; Both endpoints (kutsu, callee) use context `internal`.
;=====================================================================

[internal]

; Call the Linphone softphone (a real two-way SIP<->SIP call).
exten => 6001,1,NoOp(Dialing callee / Linphone)
 same => n,Dial(PJSIP/callee,30)
 same => n,Hangup()

; Echo test: Asterisk answers and echoes your audio back. Best first check —
; validates the whole RTP + G.711 round-trip without needing Linphone.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Play a built-in prompt (one-way audio from Asterisk to the caller).
exten => 601,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; Continuous 1 kHz test tone.
exten => 602,1,Answer()
 same => n,Milliwatt()
